name: Manual Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run Terraform against"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      terraform_command:
        description: "Terraform command to run, for example: terraform plan"
        required: true
        type: string

jobs:
  terraform:
    name: Run Terraform Command
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_WORKING_DIR: environments/${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Run Terraform command
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: ${{ inputs.terraform_command }}
